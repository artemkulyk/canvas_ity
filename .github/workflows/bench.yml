name: Bench

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: git ref for A/B baseline header (default 8be29cb)
        required: false
        default: 8be29cb

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Enable MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: "Run bench (split TU: lib -O2 C++03, harness C++11)"
        shell: bash
        env:
          BASE_REF: ${{ github.event.inputs.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # All include paths inside bench/local_ab.py are absolute, so
          # this works no matter what the runner cwd is (MSVC on CI
          # runs with bench/build as its cwd).
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            python bench/local_ab.py --pairs 7 --trials 9 \
              --base "${BASE_REF:-8be29cb}" --out bench.json || true
          elif [ "${REF}" != "refs/heads/main" ] || [ "${EVENT_NAME}" = "pull_request" ]; then
            git fetch origin main --no-tags --prune
            python bench/local_ab.py --pairs 7 --trials 9 \
              --base origin/main --out bench.json || true
          else
            python bench/local_ab.py --pairs 7 --trials 9 \
              --single --out bench.json
          fi
          # ASCII-only report: safe for the Windows cp1252 console and
          # for $GITHUB_STEP_SUMMARY on every runner.
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open("bench.json", encoding="utf-8"))
          print("# Bench %s %s (%s)" % (
              report["os"], report["arch"], report["compiler"]))
          print("")
          print("- lib: `%s`  harness: `%s`" % (
              report["lib_flags"], report["harness_flags"]))
          if report.get("mode") == "local_ab":
              print("- base `%s` vs ours `%s`" % (
                  report["base_id"], report["ours_sha"]))
              print("- gated geo: %+.1f%% (base %.3f ms -> ours %.3f ms)" % (
                  report["geo_delta_pct"], report["geo_a"], report["geo_b"]))
              print("- verdict: %s wins=%s vetoes=%s unstable=%s demoted=%s" % (
                  "KEEP_CANDIDATE" if report["keep_candidate"] else "DROP",
                  report["clean_wins"], report["vetoes"],
                  report["unstable"], report["demoted"]))
              print("")
              print("| workload | base | ours | delta | spread A | spread B | status |")
              print("|---|---:|---:|---:|---:|---:|---|")
              for name, s in report["workloads"].items():
                  print("| %s | %.3f | %.3f | %+.1f%% | %.1f%% | %.1f%% | %s |" % (
                      name, s["median_a"], s["median_b"], s["delta_pct"],
                      100.0 * s["spread_a"], 100.0 * s["spread_b"],
                      s["status"]))
          else:
              print("- ours `%s`" % report["ours_sha"])
              print("- gated geo: %.3f ms" % report["geo_ms"])
              print("")
              print("| workload | median ms | spread | gated |")
              print("|---|---:|---:|---|")
              for name, s in report["workloads"].items():
                  print("| %s | %.3f | %.1f%% | %s |" % (
                      name, s["median_ms"], 100.0 * s["spread"],
                      "yes" if s["gated"] else "no"))
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: bench.json
