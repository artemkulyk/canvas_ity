name: Bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Enable MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run microbench
        run: python bench/ci_bench.py --repeats 5 --trials 5 --out bench.json

      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: bench.json

  summarize:
    needs: bench
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bench-*

      - name: Cross-platform summary
        run: python bench/ci_bench.py --summarize artifacts
