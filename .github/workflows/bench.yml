name: Bench

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: git ref for A/B baseline header (default 8be29cb)
        required: false
        default: 8be29cb

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Enable MSVC
        if: runner.os == 'Windows'
        uses: iShark5060/actions-msvc-dev-cmd@v1.0.2

      - name: "Run bench (split TU: lib -O2 C++03, harness C++11)"
        shell: bash
        env:
          BASE_REF: ${{ github.event.inputs.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # All include paths inside bench/local_ab.py are absolute, so
          # this works no matter what the runner cwd is (MSVC on CI
          # runs with bench/build as its cwd).
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            python bench/local_ab.py --pairs 7 --trials 9 \
              --base "${BASE_REF:-8be29cb}" --out bench.json \
              --renders renders || true
          elif [ "${REF}" != "refs/heads/main" ] || [ "${EVENT_NAME}" = "pull_request" ]; then
            git fetch origin main --no-tags --prune
            python bench/local_ab.py --pairs 7 --trials 9 \
              --base origin/main --out bench.json \
              --renders renders || true
          else
            python bench/local_ab.py --pairs 7 --trials 9 \
              --single --out bench.json --renders renders
          fi
          # ASCII-only report: safe for the Windows cp1252 console and
          # for $GITHUB_STEP_SUMMARY on every runner.
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open("bench.json", encoding="utf-8"))
          print("# Bench %s %s (%s)" % (
              report["os"], report["arch"], report["compiler"]))
          print("")
          print("- lib: `%s`  harness: `%s`" % (
              report["lib_flags"], report["harness_flags"]))
          print("- workload renders: artifact bench-renders-%s" % (
              "${{ matrix.os }}"))
          if report.get("mode") == "local_ab":
              print("- base `%s` vs ours `%s`" % (
                  report["base_id"], report["ours_sha"]))
              print("- gated geo: %+.1f%% (base %.3f ms -> ours %.3f ms)" % (
                  report["geo_delta_pct"], report["geo_a"], report["geo_b"]))
              print("- verdict: %s wins=%s vetoes=%s unstable=%s demoted=%s" % (
                  "KEEP_CANDIDATE" if report["keep_candidate"] else "DROP",
                  report["clean_wins"], report["vetoes"],
                  report["unstable"], report["demoted"]))
              print("")
              print("| workload | base | ours | delta | spread A | spread B | status |")
              print("|---|---:|---:|---:|---:|---:|---|")
              for name, s in report["workloads"].items():
                  print("| %s | %.3f | %.3f | %+.1f%% | %.1f%% | %.1f%% | %s |" % (
                      name, s["median_a"], s["median_b"], s["delta_pct"],
                      100.0 * s["spread_a"], 100.0 * s["spread_b"],
                      s["status"]))
          else:
              print("- ours `%s`" % report["ours_sha"])
              print("- gated geo: %.3f ms" % report["geo_ms"])
              print("")
              print("| workload | median ms | spread | gated |")
              print("|---|---:|---:|---|")
              for name, s in report["workloads"].items():
                  print("| %s | %.3f | %.1f%% | %s |" % (
                      name, s["median_ms"], 100.0 * s["spread"],
                      "yes" if s["gated"] else "no"))
          EOF

      - uses: actions/upload-artifact@v6
        with:
          name: bench-${{ matrix.os }}
          path: bench.json

      - uses: actions/upload-artifact@v6
        with:
          name: bench-renders-${{ matrix.os }}
          path: renders/*.png
          if-no-files-found: error

  # Publish one illustrated report: medians for every OS side by side
  # plus the rendered workload images, embedded by raw URL from the
  # bench-renders branch (job summaries cannot inline artifact files).
  # Replacing that disposable branch needs a force push, but it is not
  # main; main itself is only ever fast-forwarded.
  publish:
    needs: bench
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - uses: actions/download-artifact@v7
        with:
          pattern: "bench-*"
          path: all

      - name: Push renders to the bench-renders branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir site
          for dir in all/bench-renders-*; do
            os="${dir#all/bench-renders-}"
            mkdir -p "site/$os"
            cp "$dir"/*.png "site/$os/"
          done
          cd site
          git init -q -b bench-renders
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Bench renders for run ${GITHUB_RUN_ID}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:bench-renders

      - name: Write the illustrated report
        run: |
          set -euo pipefail
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          base = ("https://raw.githubusercontent.com/%s/"
                  "bench-renders" % repo)
          systems = []
          for name in sorted(os.listdir("all")):
              if name.startswith("bench-renders-"):
                  systems.append(name[len("bench-renders-"):])
          systems.sort(key=lambda s: s != "ubuntu-latest")
          reports = []
          for system in systems:
              path = "all/bench-%s/bench.json" % system
              with open(path, encoding="utf-8") as handle:
                  reports.append((system, json.load(handle)))

          print("# Bench report")
          print("")
          print("Run %s.  The images below are rendered by the same" % run_id)
          print("code the timers measure; the PNGs also live on the")
          print("`bench-renders` branch and in the `bench-renders-<os>`")
          print("artifacts of this run.")
          print("")
          print("| workload | " + " | ".join(
              "%s med ms (spread)" % system
              for system, _ in reports) + " |")
          print("|---|" + "|".join(["---:"] * len(reports)) + "|")

          def medians(report, stats):
              # Single-tree reports carry one median; A/B reports
              # carry base and ours, and we show ours.
              if "median_ms" in stats:
                  return stats["median_ms"], stats["spread"]
              return stats["median_b"], stats["spread_b"]

          for name in reports[0][1]["workloads"]:
              cells = []
              for _, report in reports:
                  stats = report["workloads"][name]
                  med, spread = medians(report, stats)
                  cells.append("%.1f (%.1f%%)" % (med, 100.0 * spread))
              print("| %s | %s |" % (name, " | ".join(cells)))
          geo_cells = []
          for _, report in reports:
              if "geo_ms" in report:
                  geo_cells.append("%.1f" % report["geo_ms"])
              else:
                  geo_cells.append("%.1f (ours)" % report["geo_b"])
          print("| **geo mean** | %s |" % " | ".join(geo_cells))
          print("")
          compilers = {system: report["compiler"]
                       for system, report in reports}
          for system in systems:
              # The first system renders expanded; the rest collapse.
              print("<details%s>" % (
                  " open" if system == systems[0] else ""))
              print("")
              print("## %s (%s)" % (system, compilers[system]))
              print("")
              for name in reports[0][1]["workloads"]:
                  print("![%s](%s/%s/%s.png)" % (name, base, system, name))
              print("")
              print("</details>")
              print("")
          EOF
